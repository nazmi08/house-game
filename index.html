<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Quest</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; background-color: lightblue;}
    li { margin: 0.5rem 0; }
    .done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>House Quest Trial_v1</h1>
  <form onsubmit="addChore(event)">
    <input id="chore" placeholder="New chore, e.g. wipe kitchen counter">
    <select id="room">
        <option>Living Room</option>
        <option>Kitchen</option>
        <option>Bathroom</option>
    </select>
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

 <script>
    const list = document.getElementById("list");
    const chores = [];

    function addChore(event) {
        if (event) event.preventDefault();

        const input = document.getElementById("chore");
        const room = document.getElementById("room");
        if (input.value.trim() === "") return;

        chores.push({ text: input.value, room: room.value, done: false});
        input.value = "";
        render();
    }

    function toggleChore(index) {
        chores[index].done = !chores[index].done;
        render();
    }

    function render() {
        list.innerHTML= "";
        chores.forEach((chore, index) => {
            const item = document.createElement("li");
            item.textContent = chore.room + ": " + chore.text;
            if (chore.done) item.classList.add("done");
            item.onclick = () => toggleChore(index);
            list.appendChild(item);
        });
    }
  </script>
</body>
</html>
